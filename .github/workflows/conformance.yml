name: Conformance Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Verify core conformance evidence
        run: |
          python tools/das1_verify.py verify \
            --receipts das1/examples/receipt_packs \
            --exceptions das1/examples/exceptions \
            --drills das1/examples/drills \
            --tool-catalogs das1/examples/tool_catalogs \
            --policy-snapshots das1/examples/policy_snapshots \
            --ir-annexes das1/examples/ir_annexes \
            --report conformance-report.json

      - name: Verify OpenClaw overlay evidence
        run: |
          python tools/das1_verify.py verify-overlay \
            --receipts das1/examples/openclaw/receipt_packs \
            --exceptions das1/examples/exceptions \
            --drills das1/examples/openclaw/drills \
            --tool-catalogs das1/examples/tool_catalogs \
            --policy-snapshots das1/examples/policy_snapshots \
            --ir-annexes das1/examples/ir_annexes \
            --overlay openclaw \
            --report openclaw-overlay-report.json

      - name: Verify Claude Code overlay evidence
        run: |
          python tools/das1_verify.py verify-overlay \
            --receipts das1/examples/claude-code/receipt_packs \
            --exceptions das1/examples/exceptions \
            --drills das1/examples/claude-code/drills \
            --tool-catalogs das1/examples/tool_catalogs \
            --policy-snapshots das1/examples/policy_snapshots \
            --ir-annexes das1/examples/ir_annexes \
            --overlay claude-code \
            --report claude-code-overlay-report.json

      - name: Verify Codex overlay evidence
        run: |
          python tools/das1_verify.py verify-overlay \
            --receipts das1/examples/codex/receipt_packs \
            --exceptions das1/examples/exceptions \
            --drills das1/examples/codex/drills \
            --tool-catalogs das1/examples/tool_catalogs \
            --policy-snapshots das1/examples/policy_snapshots \
            --ir-annexes das1/examples/ir_annexes \
            --overlay codex \
            --report codex-overlay-report.json

      - name: Verify Cursor overlay evidence
        run: |
          python tools/das1_verify.py verify-overlay \
            --receipts das1/examples/cursor/receipt_packs \
            --exceptions das1/examples/exceptions \
            --drills das1/examples/cursor/drills \
            --tool-catalogs das1/examples/tool_catalogs \
            --policy-snapshots das1/examples/policy_snapshots \
            --ir-annexes das1/examples/ir_annexes \
            --overlay cursor \
            --report cursor-overlay-report.json

      - name: Verify Kiro overlay evidence
        run: |
          python tools/das1_verify.py verify-overlay \
            --receipts das1/examples/kiro/receipt_packs \
            --exceptions das1/examples/exceptions \
            --drills das1/examples/kiro/drills \
            --tool-catalogs das1/examples/tool_catalogs \
            --policy-snapshots das1/examples/policy_snapshots \
            --ir-annexes das1/examples/ir_annexes \
            --overlay kiro \
            --report kiro-overlay-report.json

      - name: Verify v0.003 core evidence (draft)
        run: |
          python tools/das1_verify.py verify \
            --das-version v0.003 \
            --receipts das1/examples/v0003/receipt_packs \
            --exceptions das1/examples/exceptions \
            --drills das1/examples/v0003/drills \
            --tool-catalogs das1/examples/v0003/tool_catalogs \
            --policy-snapshots das1/examples/policy_snapshots \
            --ir-annexes das1/examples/ir_annexes \
            --delegation-records das1/examples/v0003/delegation_records \
            --classification-registers das1/examples/v0003/classification_registers \
            --report conformance-v0003-report.json

      - name: Prove the v0.003 checks fire
        run: python tools/test_v0003_checks.py

      - name: Verify conformance claim packets
        run: |
          python tools/das1_verify.py verify-claims das1/examples/claims \
            --report claims-report.json

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: conformance-reports
          path: |
            conformance-report.json
            conformance-v0003-report.json
            openclaw-overlay-report.json
            claude-code-overlay-report.json
            codex-overlay-report.json
            cursor-overlay-report.json
            kiro-overlay-report.json
            claims-report.json
